name: Deploy to GitHub Pages

# PAUSED mid-migration (see MIGRACAO_SHEETS.md) — next.config.ts dropped `output: "export"` once
# server-only API routes (NextAuth) landed, so `npm run build` here no longer produces `./out` and
# this workflow would fail on every push. Auto-trigger removed on purpose so a broken run doesn't
# show up red on every commit while the migration is in progress; the live GitHub Pages site keeps
# serving whatever was last successfully deployed (the pre-migration, Supabase-backed build) until
# step 7 of the plan ("aposentar o GitHub Pages") retires this workflow for good in favor of Vercel.
#
# Builds the Next.js static export and publishes it to GitHub Pages.
# Set the Supabase env vars as repository secrets:
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
# (anon key is public by design; real security is enforced by RLS.)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
